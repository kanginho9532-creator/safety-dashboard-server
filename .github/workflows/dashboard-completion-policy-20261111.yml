              if(panel){let summary=document.getElementById('schedule-contract-summary');if(!summary){summary=document.createElement('p');summary.id='schedule-contract-summary';panel.prepend(summary);}const items=Object.values(buckets).flat();const n=items.filter(x=>!x.manual).length;summary.textContent='이번달 관리 계약 '+n+'건 · 5개 분류 합계 '+n+'건 · 수동 작업 '+items.filter(x=>x.manual).length+'건(계약 집계 제외)';}
              sectionMap.forEach(([key,elId,countId,emptyMsg])=>{""")
          h=h[:a]+board+h[b:]
          h=one(h,'  taskCategoryOverride[item.itemKey] = category;','  taskCategoryOverride[item.itemKey] = category;\n  item.s.workManagement=CATEGORY_LABELS[category];')
