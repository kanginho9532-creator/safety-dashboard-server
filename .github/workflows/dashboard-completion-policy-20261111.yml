          T=r'''const assert=require('assert');const at=new Date('2026-11-11T12:46:00Z');let n=0;function check(v){assert(v);n++;}const done=(d,e='2026-11-11')=>({status:'공사완료',completedAt:d,lastEdited:e});check(!isSiteVisibleByCompletion(done('2026-10-25'),at));check(isSiteVisibleByCompletion(done('2026-11-10'),at));check(isSiteVisibleByCompletion(done('2026-11-01','2026-10-31'),at));check(!isSiteVisibleByCompletion(done('2026-11-10'),new Date('2026-12-01T00:00:00+09:00')));check(isSiteVisibleByCompletion(done('2026-10-31T15:00:00Z'),at));check(isCompletionDateReview(done(null),at));check(!isSiteVisibleByCompletion(done(null),at));check(isCompletionDateReview(done('2026-11-30'),at));check(!isSiteVisibleByCompletion(done('2026-11-30'),at));check(isCompletionDateReview(done('not-a-date'),at));check(!isSiteVisibleByCompletion({...done(null),end:'2026-11-10'},at));check(isSiteVisibleByCompletion({status:'진행 중',completedAt:'2026-10-01'},at));const overdue=(v,c)=>dashboardIsOverdue({},v,c,at);check(!overdue(['2026-11-10'],['2026-10-28']));check(!overdue(['2026-11-01'],['2026-10-01']));check(!overdue(['2026-10-01'],['2026-11-10']));check(overdue(['2026-10-28'],['2026-10-20']));check(!overdue(['2026-10-29'],[]));check(overdue([],[]));check(overdue(['2026-11-20'],['2026-10-01']));check(dashboardWorkCategory({})==='sudden');check(dashboardWorkCategory({workManagement:'기타'})==='sudden');for(const [label,key] of [['매일 작업','daily'],['주간 작업','weekly'],['월간 작업','monthly'],['불시 작업','sudden'],['연락 회신 작업','reply']])check(dashboardWorkCategory({workManagement:label})===key);const rt=v=>({type:'rich_text',rich_text:[{plain_text:v}]}),ph=v=>({type:'phone_number',phone_number:v});const props={'책임자':rt('A'),'책임자 연락처':ph('010-1111-2222'),'감독자':rt('B'),'감독자 연락처':ph('010-9999-9999'),'완료처리일':{type:'date',date:{start:'2026-11-10'}}};const mapped=pageToSite({id:'p1',properties:props,last_edited_time:'2026-11-11'});check(mapped.managerName==='A');check(mapped.contact==='010-1111-2222');check(mapped.completedAt==='2026-11-10');check(pageToSite({properties:{'감독자':rt('B')}}).managerName==='');const changes=buildSiteUpdatesFromProperties(props,{managerName:'C',contact:'010-2222-3333'});check(!!changes['책임자']&&!changes['감독자']);check(!!changes['책임자 연락처']&&!changes['감독자 연락처']);const g=groupSites([{id:'old',name:'현장',status:'공사완료',completedAt:'2026-10-01',lastEdited:'2026-10-01',lastVisit:'2026-10-01'},{id:'new',name:'현장',status:'진행 중',lastEdited:'2026-11-10',lastVisit:'2026-11-10'}])[0];check(g.status==='진행 중');check(g.visitDates.length===2);check(g.pageIds.length===2);console.log('Passed '+n+' policy tests');'''
