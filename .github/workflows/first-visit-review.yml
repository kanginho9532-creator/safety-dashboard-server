name: First visit review dashboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/first-visit-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test $(git hash-object app/safety-dashboard.html) = 15576dece94b470519ff526c794320f15e973c2b
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/safety-dashboard.html'); h=p.read_text()
          hook='function initAllViews(){'
          assert h.count(hook)==1 and '<script>' in h
          h=h.replace(hook,hook+' renderFirstVisitReview(sites);',1)
          js=r'''function renderFirstVisitReview(sites){
            const host=document.querySelector('.grid-top');if(!host)return;
            let panel=document.getElementById('first-visit-review');if(!panel){panel=document.createElement('section');panel.id='first-visit-review';panel.className='panel';host.before(panel);}
            const el=(tag,text)=>{const node=document.createElement(tag);if(text!=null)node.textContent=text;return node;};
            panel.replaceChildren(el('h3','첫 방문 우선관리'),el('p','방문일은 실제 방문 실적이 아니며, 연락요청일은 실제 통화일이 아닙니다.'));
            const groups=[[],[],[],[]], today=completionDayKST(new Date());
            const dates=values=>values.filter(Boolean).map(completionDayKST).filter(d=>d&&Number.isFinite(Date.parse(d))).sort();
            for(const s of sites){if(!Array.isArray(s.pageDetails)||!s.pageDetails.length||isLatestStatusCompleted(s))continue;
              const raw=[...(s.visitDates||[]),s.lastVisit].filter(Boolean), visits=dates(raw), next=visits.find(d=>d>today), last=visits.filter(d=>d<=today).pop(), contact=dates([...(s.contactDates||[]),s.contactRequest]).pop();
              const i=String(s.status||'').replace(/\s/g,'')==='공사중지'?3:last||(raw.length&&!visits.length)?1:next?2:0;groups[i].push({s,next,last,contact});
            }
            groups[0].sort((a,b)=>(a.contact||'').localeCompare(b.contact||'')||String(a.s.name).localeCompare(String(b.s.name),'ko'));
            ['연락 우선 확인','방문 기록 확인 필요','방문 예정','착공·재개 확인'].forEach((label,i)=>{const section=el('details');section.open=i===0;section.append(el('summary',label+' · '+groups[i].length+'건'));const list=el('div');list.style.cssText='max-height:350px;overflow:auto;';
              for(const {s,next,last,contact} of groups[i]){const row=el('article');row.style.cssText='padding:8px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere';const button=el('button',s.name);button.type='button';button.onclick=()=>openDetailByName(s.name);row.append(button,el('div',[s.company,s.status,'연락요청일: '+(contact||'미등록'),next?'방문 예정: '+next:'',last?'실적 미확인 방문일: '+last:''].filter(Boolean).join(' · ')));if(s.note){const note=el('details');note.append(el('summary','비고: '+s.note.slice(0,65)+(s.note.length>65?'…':'')),el('p',s.note));row.append(note);}list.append(row);}
              section.append(list);panel.append(section);
            });
          }
          '''
          h=h.replace('<script>','<script>\n'+js,1)
          for text in re.findall(r'<script\b[^>]*>(.*?)</script>',h,re.S): subprocess.run(['node','--check'],input=text,text=True,check=True)
          p.write_text(h)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/safety-dashboard.html
          git diff --cached --check
          git commit -m 'Show first visit review on the dashboard'
          git push origin HEAD:main
