name: Compact first visit UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/first-visit-compact.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/safety-dashboard.html'); h=p.read_text()
          a=h.index('function renderFirstVisitReview('); b=h.index('function summarizeWorkContracts(',a); js=h[a:b]
          old="section.open=i===0;"
          assert js.count(old)==1
          js=js.replace(old,"section.name='first-visit-sections';section.className='fv-group';")
          old="list.style.cssText='max-height:350px;overflow:auto;';"
          assert js.count(old)==1
          js=js.replace(old,"list.className='fv-list';if(!groups[i].length)list.append(el('p','해당 현장이 없습니다.'));")
          h=h[:a]+js+h[b:]
          css='''#first-visit-review{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 14px;margin-bottom:12px;border-radius:16px}#first-visit-review>h3,#first-visit-review>p{grid-column:1/-1;margin:0}#first-visit-review>p{font-size:12px;color:var(--muted)}.fv-group{--fv:#1d4ed8;min-width:0}.fv-group:nth-of-type(2){--fv:#92400e}.fv-group:nth-of-type(3){--fv:#047857}.fv-group:nth-of-type(4){--fv:#6d28d9}.fv-group>summary{cursor:pointer;background:#f8fafc;border:1px solid var(--border);border-left:3px solid var(--fv);border-radius:10px;padding:10px 12px;color:var(--fv);font-size:13px;font-weight:700}.fv-group>summary:hover,.fv-group[open]>summary{background:#eef2ff}.fv-group[open]{grid-column:1/-1;order:1}.fv-list{max-height:260px;overflow:auto;padding:0 10px;font-size:13px;color:var(--muted)}.fv-list article>button{border:0;background:none;color:#1d4ed8;padding:4px 0;font:inherit;font-weight:700;text-align:left;cursor:pointer}.fv-list article>button:hover{text-decoration:underline}.fv-list article summary{cursor:pointer;margin-top:4px}.fv-list article p{white-space:pre-wrap;margin:4px 0}@media(max-width:760px){#first-visit-review{grid-template-columns:repeat(2,minmax(0,1fr))}}'''
          assert 'className=\'fv-group\'' not in h[:a]
          h=h.replace('</style>',css+'\n</style>',1)
          for s in re.findall(r'<script\b[^>]*>(.*?)</script>',h,re.S): subprocess.run(['node','--check'],input=s,text=True,check=True)
          p.write_text(h)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/safety-dashboard.html
          git diff --cached --check
          git commit -m 'Compact first visit dashboard UI'
          git push origin HEAD:main
