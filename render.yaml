services:
  - type: web
    name: safety-dashboard-notion
    env: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_COMPANY_DATABASE_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
